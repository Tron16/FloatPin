name: Release

# Builds the dmg for the version in Info.plist and publishes it.
# - New version (no release yet): creates the release from its CHANGELOG entry.
# - Same version, newer code: rebuilds the dmg, swaps it into the existing
#   release, and moves the tag to this commit, so the download is always current.
# Bump CFBundleShortVersionString (and add a CHANGELOG entry) to ship a new version.
on:
  push:
    branches: [main]
    paths:
      - Info.plist
      - Sources/**
      - Resources/**
      - build.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Build disk image
        run: ./build.sh dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v$VERSION"
          awk -v v="[$VERSION]" 'index($0, "## ") == 1 { p = (index($0, v) > 0); next } p' CHANGELOG.md > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" FloatPin.dmg --clobber
            gh release edit "$TAG" --notes-file notes.md
            echo "Refreshed $TAG with a new build of $GITHUB_SHA"
          else
            gh release create "$TAG" FloatPin.dmg \
              --title "FloatPin $VERSION" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
          fi
