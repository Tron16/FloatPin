name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app and disk image
        run: ./build.sh dmg

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: FloatPin
          path: FloatPin.dmg
