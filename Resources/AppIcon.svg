<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="front"><rect x="0" y="0" width="470" height="340" rx="40"/></clipPath>
  </defs>

  <!-- squircle body -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- window left behind -->
    <g opacity="0.9">
      <rect x="205" y="470" width="420" height="300" rx="34" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>
      <circle cx="245" cy="505" r="10" fill="#FFFFFF" fill-opacity="0.45"/>
      <circle cx="278" cy="505" r="10" fill="#FFFFFF" fill-opacity="0.45"/>
      <circle cx="311" cy="505" r="10" fill="#FFFFFF" fill-opacity="0.45"/>
    </g>

    <!-- shadow under the floating window -->
    <rect x="345" y="400" width="450" height="300" rx="50" fill="#1E1B4B" opacity="0.45" filter="url(#soft)"/>

    <!-- floating window -->
    <g transform="translate(325 255) rotate(-5 235 170)">
      <g clip-path="url(#front)">
        <rect width="470" height="340" fill="#FFFFFF"/>
        <rect width="470" height="64" fill="#EEF2FF"/>
      </g>
      <circle cx="44" cy="32" r="12" fill="#FF5F57"/>
      <circle cx="82" cy="32" r="12" fill="#FEBC2E"/>
      <circle cx="120" cy="32" r="12" fill="#28C840"/>
      <rect x="40" y="96" width="250" height="22" rx="11" fill="#C7D2FE"/>
      <rect x="40" y="136" width="380" height="22" rx="11" fill="#E2E8F0"/>
      <rect x="40" y="176" width="320" height="22" rx="11" fill="#E2E8F0"/>
      <rect x="40" y="222" width="180" height="86" rx="18" fill="url(#photo)"/>
      <rect x="240" y="222" width="190" height="22" rx="11" fill="#E2E8F0"/>
      <rect x="240" y="260" width="140" height="22" rx="11" fill="#E2E8F0"/>
    </g>

    <!-- pushpin holding it up -->
    <g transform="translate(770 250) rotate(32)">
      <line x1="0" y1="56" x2="0" y2="150" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round"/>
      <path d="M -24 -6 L 24 -6 L 15 42 L -15 42 Z" fill="#EA580C"/>
      <rect x="-42" y="34" width="84" height="24" rx="12" fill="#F97316"/>
      <rect x="-50" y="-36" width="100" height="32" rx="16" fill="#FB923C"/>
      <rect x="-38" y="-30" width="40" height="9" rx="4.5" fill="#FFFFFF" opacity="0.6"/>
    </g>
  </g>
</svg>
